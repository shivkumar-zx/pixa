<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pixbox-grad-main" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="pixbox-grad-top" x1="8" y1="8" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="pixbox-grad-right" x1="24" y1="20" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <linearGradient id="pixbox-grad-left" x1="8" y1="20" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <filter id="pixbox-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shadow background -->
  <ellipse cx="24" cy="42" rx="14" ry="3.5" fill="#0F172A" fill-opacity="0.15" />

  <!-- 3D Box - Left Face -->
  <path d="M8 18L24 26V40L8 32V18Z" fill="url(#pixbox-grad-left)" />

  <!-- 3D Box - Right Face -->
  <path d="M24 26L40 18V32L24 40V26Z" fill="url(#pixbox-grad-right)" />

  <!-- 3D Box - Top Face -->
  <path d="M24 8L40 16L24 24L8 16L24 8Z" fill="url(#pixbox-grad-top)" />

  <!-- Front Center Vault Seam -->
  <path d="M24 26V36" stroke="#C7D2FE" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Floating Pixel 1 (Top Right) -->
  <rect x="34" y="6" width="5" height="5" rx="1.2" fill="#38BDF8" filter="url(#pixbox-glow)" />

  <!-- Floating Pixel 2 (Top Left Small) -->
  <rect x="10" y="8" width="3.5" height="3.5" rx="0.8" fill="#C084FC" filter="url(#pixbox-glow)" />

  <!-- Floating Pixel 3 (Center Keyhole Pixel) -->
  <rect x="22" y="14" width="4" height="4" rx="1" fill="#FFFFFF" />
</svg>
